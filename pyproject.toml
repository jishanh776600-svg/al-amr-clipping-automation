[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipping-automation"
version = "0.1.0"
description = "Autonomous, zero-cost, device-independent vertical video clipping pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Clipping Automation Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.30",
    "yt-dlp>=2024.4.9",
    "faster-whisper>=1.0.2",
    "scenedetect[opencv]>=0.6.4",
    "pysubs2>=1.7.1",
    "filterpy>=1.4.5",
    "instructor>=1.3.0",
    "aiogram>=3.6.0",
    "google-api-python-client>=2.128.0",
    "google-auth-oauthlib>=1.2.0",
    "videohash>=0.2.2",
    "docling>=2.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pypdf>=4.2.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "pyannote.audio>=3.1.1",
]
gdrive = [
    "PyDrive2>=1.19.0",
    "google-api-python-client>=2.128.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
