# ==============================================================================
# RENDER BLUEPRINT // AL AMR CLIPPING FREE TIER DEPLOYMENT
# ==============================================================================
# 100% Free Tier:
# - Plan: free (No credit card or payment info required)
# - Unified Web Service: FastApi + Studio UI + In-process Worker
# - Ephemeral container storage: /tmp/project_vault
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PRODUCTION WEB SERVICE (Control Room UI + API + In-Process Processing)
  # ----------------------------------------------------------------------------
  - type: web
    name: al-amr-clipping-automation
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_DRIVER
        value: local
      - key: LOCAL_STORAGE_ROOT
        value: /tmp/project_vault
      - key: ENABLE_IN_PROCESS_WORKER
        value: "true"
      - key: AL_AMR_MASTER_KEY
        generateValue: true
      - key: OPERATOR_TOKEN
        value: alamr-op-2024-secure
      - key: TELEGRAM_SECRET_TOKEN
        generateValue: true

