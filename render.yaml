# ==============================================================================
# RENDER BLUEPRINT // AL AMR CLIPPING AUTONOMOUS PRODUCTION DEPLOYMENT
# ==============================================================================
# AutoClip Remote Production Web Service:
# - FastAPI backend + Web Operator Console + In-Process JobQueue Worker
# - Healthcheck endpoint: /health
# - Persistent storage mount: /data
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PRODUCTION WEB SERVICE (Operator Console + API + Pipeline Worker)
  # ----------------------------------------------------------------------------
  - type: web
    name: al-amr-clipping-automation
    runtime: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    disk:
      name: autoclip-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: AUTOCLIP_HOME
        value: /data
      - key: OPERATOR_TOKEN
        value: alamr-op-2024-secure
      - key: AUTOCLIP_API_KEY
        value: alamr-op-2024-secure
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: AL_AMR_MASTER_KEY
        generateValue: true
      - key: AUTOCLIP_DISPATCH_MODE
        value: auto
      - key: GITHUB_REPOSITORY
        value: jishanh776600-svg/al-amr-clipping-automation
      - key: GITHUB_WORKFLOW
        value: worker.yml
      - key: GITHUB_REF
        value: main
      - key: GITHUB_PAT
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_ID
        sync: false
      - key: GOOGLE_DRIVE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false


