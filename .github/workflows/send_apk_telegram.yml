name: Dispatch Release APK to Telegram

on:
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Target Telegram Chat ID (leave empty to use default repository secret)'
        required: false
        default: ''

jobs:
  build-and-send-apk:
    name: Build & Send APK to Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Send Release APK to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_CHAT_ID: ${{ github.event.inputs.chat_id }}
        run: |
          TARGET_CHAT="${CUSTOM_CHAT_ID:-$TELEGRAM_CHAT_ID}"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TARGET_CHAT" ]; then
            echo "Error: TELEGRAM_BOT_TOKEN or TARGET_CHAT is empty."
            exit 1
          fi

          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file not found at $APK_PATH"
            exit 1
          fi

          echo "Uploading $APK_PATH to Telegram chat $TARGET_CHAT..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -F "chat_id=${TARGET_CHAT}" \
            -F "document=@${APK_PATH}" \
            -F "caption=🚀 AL AMR Operator App (Release APK)
Step 11 Production Build
Package: com.alamr.operator
Size: $(du -h "$APK_PATH" | cut -f1)" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")

          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS")

          echo "Response: $BODY"
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Failed to send APK to Telegram (HTTP $HTTP_STATUS)"
            exit 1
          fi
          echo "Successfully delivered APK to Telegram!"
