name: Master Agent Cloud Worker Runner

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Specific Target Task ID (leave empty to poll queue)'
        required: false
        default: ''
        type: string
      poll_queue:
        description: 'Poll queue for pending tasks if task_id is omitted'
        required: false
        default: true
        type: boolean
      max_tasks:
        description: 'Maximum tasks to process in this runner run'
        required: false
        default: '1'
        type: string

jobs:
  run-cloud-worker:
    name: Headless Agent Worker
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_ALLOWED_USER_IDS: ${{ secrets.TELEGRAM_ALLOWED_USER_IDS }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      STORAGE_DRIVER: "gdrive"
      ENVIRONMENT: "production"

    steps:
      - name: Checkout Independent Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies & Open Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libfontconfig1 \
            fonts-liberation \
            fonts-dejavu-core

      - name: Cache ML Models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/torch
          key: ${{ runner.os }}-ml-models-${{ hashFiles('pyproject.toml') }}

      - name: Install Project
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Execute Cloud Agent Worker
        run: |
          if [ -n "${{ inputs.task_id }}" ]; then
            python -m clipping.cli.agent_worker --task-id "${{ inputs.task_id }}"
          else
            python -m clipping.cli.agent_worker --poll-queue --max-tasks "${{ inputs.max_tasks }}"
          fi
