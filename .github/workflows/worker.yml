name: AL AMR On-Demand Clipping Worker

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Unique Job ID to process"
        required: true
        type: string
      source_url:
        description: "URL or path of source video to ingest"
        required: true
        type: string
      campaign_brief:
        description: "Campaign Brief JSON string"
        required: false
        default: "{}"
        type: string
      callback_url:
        description: "Control plane callback endpoint"
        required: false
        default: ""
        type: string
      callback_token:
        description: "Auth token for callback"
        required: false
        default: ""
        type: string
      publish_targets:
        description: "Publish destinations JSON array"
        required: false
        default: "[]"
        type: string
      whisper_model:
        description: "Faster-Whisper model name"
        required: false
        default: "base"
        type: string
      max_clips:
        description: "Maximum clips to generate"
        required: false
        default: "3"
        type: string
      min_duration_s:
        description: "Minimum clip duration in seconds"
        required: false
        default: "20"
        type: string
      max_duration_s:
        description: "Maximum clip duration in seconds"
        required: false
        default: "60"
        type: string
      job_settings:
        description: "Job settings JSON string"
        required: false
        default: "{}"
        type: string

concurrency:
  group: worker-${{ github.event.inputs.job_id }}
  cancel-in-progress: false

jobs:
  process-job:
    name: Execute AL AMR Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Multimedia Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            libsm6 \
            libxext6 \
            libgl1 \
            libegl1 \
            libgles2 \
            fonts-dejavu-core \
            fonts-freefont-ttf

      - name: Set up Deno for yt-dlp challenge execution
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install AL AMR Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e . "httpx[socks]" "socksio"
          python -m pip install google-api-python-client google-auth

      - name: Verify Multimedia & YouTube Extraction Runtime
        run: |
          python -m yt_dlp --version
          which deno && deno --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Start Cloudflare WARP Egress Sidecar
        run: |
          docker run --name warp -d \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -p 127.0.0.1:1080:1080 \
            caomingjun/warp
          
          echo "Waiting for WARP egress sidecar to initialize..."
          for i in {1..20}; do
            TRACE=$(curl -s --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || true)
            if echo "$TRACE" | grep -q "warp=on\|warp=plus"; then
              echo "WARP egress sidecar active (attempt $i)."
              echo "$TRACE" | grep -E '^(ip|loc|warp)='
              break
            fi
            sleep 2
          done

      - name: Start Proof-of-Origin Token Provider Server
        run: |
          docker run --name bgutil-provider --network host -d --init \
            brainicism/bgutil-ytdlp-pot-provider
          sleep 5
          curl -s http://127.0.0.1:4416/ping || true

      - name: Cache Whisper Model Weights
        uses: actions/cache@v4
        with:
          path: /home/runner/.autoclip/models/whisper
          key: whisper-models-${{ runner.os }}-${{ github.event.inputs.whisper_model || 'base' }}-v1
          restore-keys: |
            whisper-models-${{ runner.os }}-

      - name: Run AL AMR Worker Runner
        env:
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PUBLISH_LIVE: ${{ secrets.YOUTUBE_PUBLISH_LIVE }}
          YOUTUBE_COOKIES_TEXT: ${{ secrets.YOUTUBE_COOKIES_TEXT }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN || secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AUTOCLIP_PROXY: socks5h://127.0.0.1:1080
        run: |
          python -m autoclip.jobs.worker_runner \
            --job-id "${{ github.event.inputs.job_id }}" \
            --source-url "${{ github.event.inputs.source_url }}" \
            --campaign-brief '${{ github.event.inputs.campaign_brief }}' \
            --callback-url "${{ github.event.inputs.callback_url }}" \
            --callback-token "${{ github.event.inputs.callback_token }}" \
            --publish-targets '${{ github.event.inputs.publish_targets }}' \
            --whisper-model "${{ github.event.inputs.whisper_model }}" \
            --max-clips "${{ github.event.inputs.max_clips }}" \
            --min-duration "${{ github.event.inputs.min_duration_s || '20' }}" \
            --max-duration "${{ github.event.inputs.max_duration_s || '60' }}" \
            --job-settings '${{ github.event.inputs.job_settings || "{}" }}'

      - name: Container Logs (WARP & POT Provider)
        if: always()
        run: |
          echo "=== WARP EGRESS LOGS ==="
          docker logs warp || true
          echo "=== POT PROVIDER LOGS ==="
          docker logs bgutil-provider || true


